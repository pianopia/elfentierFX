name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            mesa-vulkan-drivers \
            glslang-tools \
            spirv-cross

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cargo check
        run: cargo check --workspace

      - name: Core tests
        run: cargo test -p elfentier_core

      - name: Volume conversion tests
        run: cargo test -p vdb_convert

      - name: Wgpu smoke preview tests
        env:
          WGPU_BACKEND: vulkan
        run: cargo test -p elfentier_wgpu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Install Three.js converter dependencies
        working-directory: tools/three_to_unreal
        run: npm ci

      - name: Three.js conversion tests
        working-directory: tools/three_to_unreal
        env:
          GLSLANG_VALIDATOR: glslangValidator
          SPIRV_CROSS: spirv-cross
        run: npm test

      - name: Unreal bundle preflight tests
        run: python3 -m unittest discover -s integrations/unreal/tests -v
