[workspace]
resolver = "2"
members = [
    "crates/elfentier_core",
    "apps/desktop/src-tauri",
    "tools/vdb_convert",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["elfentierFX contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
